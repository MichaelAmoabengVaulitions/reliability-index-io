# Runs the same checks as `yarn run check`, then builds both apps, on every
# pull request to main and every push to main.
#
# expo-doctor is left out on purpose: two of its checks ask Expo's servers and
# sometimes fail for no reason in our code. Run it by hand in apps/mobile when
# a change touches mobile's packages.
name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a pull request stops the run still going for the older one.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Typecheck, lint and test
        run: yarn run check

      - name: Build the web app
        run: yarn workspace reliability-index-explorer run build

      - name: Bundle the mobile app
        working-directory: apps/mobile
        run: npx expo export --platform ios --platform android
